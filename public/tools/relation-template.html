e. These statements present","并列的两面":"two sides of a trade-off","，不是一条链。":"rather than a causal chain.","这两句都是文章在陈述事实，不是某个人物心里的判断。":"Both are claims made by the author, rather than a reported belief held by a character.","「谁以为什么」要有一个具体的人":"A belief relationship needs an identified thinker","，而且那个人的判断可以被后文推翻。这里「阴凉让人舒服」和「树不便宜」都是作者摆出来的，不是谁的看法。":"whose belief could be challenged. Here the author presents a benefit and a cost.","它们之间没有先后 —— 不是「先舒服，然后才变贵」。":"There is no sequence in which comfort appears first and trees then become expensive.","好处和代价是同时成立的两件事":"The benefit and cost can hold simultaneously","，说的是同一批树的两个面。标成先后，读者会以为文章在讲一个过程，而它在讲一次权衡。":"for the same trees. A sequence marker would make this sound like a process rather than a trade-off.","它们关系很紧，只是关系的方向是":"The claims are connected, but they pull in","相反":"contrasting directions","的。判成并排，你会失去这段最有价值的那一下：":". Treating them as unrelated would miss the key argumentative move:","作者主动承认了自己这一方的短板。":"the author acknowledges a limitation of the proposal.","得先出钱做养护，树":"The city must fund maintenance before the trees","才":"can","活得下来":"survive","出钱本身不会让树活 ——":"Funding alone does not keep a tree alive—","浇水、修剪、防护才会":"watering, pruning, and protection support survival","，而出钱只是排在这些动作前面的、不能少的一步。":". Funding is presented here as a necessary step before those actions.","这是另一个「先后被当成因果」的地方。":"Again, distinguish a prerequisite from a direct mechanism.","中文的「才」把条件和原因糅在一起（「出了钱才活得下来」），英语必须分开：":"In this example, the intended English wording separates a necessary condition from an immediate causal claim:","是条件，":"marks the condition, while","是原因。":"makes a causal claim.","写成":"Writing","，读起来像钱能直接变成树的存活率 —— 而这正是这篇文章想避免的那种说法。":"would imply a more direct connection between money and survival than the passage intends.","这是这一页最想让你撞第二次的地方。":"This is another chance to check that distinction.","出钱是必要条件，不是充分原因 —— 钱到位了树也可能死（选错了树种、天气不好）。":"Funding is necessary in this account but not sufficient: trees could still die because of poor species choice or weather.","一个可以带走的判据：":"A useful caution:","如果 A 发生了 B 仍然可能不发生，那 A 就不是原因，是条件。":"A necessary condition is not automatically a sufficient cause. If A occurs without B, it does not by itself establish what caused B.","让步要有转折 —— 后半要把前半往回收一点。这两句方向完全一致：都在说养护要花钱、而且非花不可。":"Both statements point in the same direction: maintenance needs funding. Neither qualifies the other.","一步都没有往回收":"There is no contrast","，所以 that said 之类的词放进去会显得莫名其妙。":", so a marker such as that said does not fit.","这里没有人在心里做判断，只有一笔钱和一批树。":"No person's belief is reported here; the statements concern funding and trees.","「谁以为什么」要有一个主体和一个可能出错的信念":"A belief relationship needs an identified thinker and a potentially mistaken belief","—— 「出了钱树才活得下来」是个客观条件，不是谁的看法，谁信不信它都成立。":". Here the funding requirement is presented as a condition, not someone's opinion.","不出钱，树就活不下来。":"Without the necessary funding, the proposed maintenance cannot be sustained.","判成并排，这篇文章最后那句话（要给养护出钱）就没了着落。":"Treating the claims as unrelated would disconnect the passage's final recommendation to fund maintenance.","第 3 步 · 换一段，自己造三条":"Step 3 · Use a new passage to create three relationships","这五张来自原文":"These five cards come from the source's","最后一段":"final paragraph","：城市的提议不是「多种树」，而是「把合适的树种在关系最强的地方，并且为养护出钱」。":". The proposal is to plant suitable trees where they matter most and fund their maintenance, rather than simply plant more trees.","把合适的树种在最需要阴凉的地方":"Place suitable trees where shade is needed most","选错的树种熬不过本地的天气":"Poorly chosen species struggle in local weather","城市为养护出钱":"The city funds maintenance","树活得够久，久到能遮出阴凉":"The trees survive long enough to provide shade","学校和公交站附近能受益的人更多":"More people can benefit near schools and bus stops","选错树种熬不过天气 / 学校附近受益的人多":"Unsuitable species struggle in the weather / more people benefit near schools","造三条关系，每条用一族不同的标记，写成英语。":"Create three English sentences, each using a different marker family.","五张卡里有":"Among the five cards,","两张之间根本没有关系":"two have no established connection","（选错树种熬不过天气 / 学校附近受益的人多）——别把它们连起来。":"(the unsuitable species and the greater number of beneficiaries near schools). Do not connect that pair.","三条关系，":"Three relationships,","三族不同的标记":"three different marker families","：因果 / 让一步 / 先后 —— 别三条都用":": cause / concession / sequence. Do not use the same marker for all three.","每条写成":"Write each relationship as","一句完整的英语":"a complete English sentence","，标记要在句子里，不能只列在旁边":"with the marker inside the sentence, not listed beside it.","那两张没关系的卡，不要塞进同一句":"Do not combine the unrelated cards in a single linked claim","。中文里并排一放没事，英语一挂标记就是宣布了一条因果":". Adding a causal marker would assert a connection the source does not establish.","一行一句。三句，三族不同的标记。":"One sentence per line. Three sentences, three different marker families.","三族都用上了 —— 你在分辨关系的种类，不是在套一个 so。":"You used all three families, distinguishing relationships rather than relying on so for everything.","用上的标记族不到三个。":"Fewer than three marker families were used.","三条关系全用 so，等于说这段里只有因果":"Using so for all three would make every link sound causal","——而它其实有因果、有让步、有先后。在上面右栏里挑三族不一样的，每族一个词。":". The passage also contains concession and sequence. Choose one marker from each of three families in the reference panel.","因果":"Cause","让一步":"Concession","先后":"Sequence","谁以为什么":"Someone's belief","没把没关系的两张硬连起来":"The unrelated cards remain separate","那两张各自站着 —— 你没有凭空造一条文章里没有的关系。":"You kept that pair separate rather than inventing a link the passage does not establish.","你把":"You combined","选错树种熬不过天气":"unsuitable species struggle in local weather","学校附近受益的人多":"more people benefit near schools","塞进了同一句，还挂上了一个标记。":"in one sentence with a linking marker.","这两件事之间没有任何关系：选错树不会让学校变热，学校热也不会让树选错。":"The passage does not establish a connection between that species choice and the number of people near schools who benefit.","中文里并排一放还挺自然，英语里一挂标记就等于宣布了一条因果，而且收不回去。":"A causal marker would assert a relationship the passage does not establish.","把它们拆成两句，中间什么都不加。":"Separate them into two statements without adding a relationship marker.","三句都写完整了":"All three sentences are complete","够长，三条关系都说清楚了。":"The draft is long enough for this exercise's check.","太短了 —— 三十五个词以下装不下三条完整的关系。每一条都要是一句能读的英语：两端各是什么、中间那个标记摆在哪儿。":"This draft is below the exercise's 35-word threshold. Check that each relationship is a complete sentence naming both sides and its linking marker.","不是照抄":"Not copied verbatim","没有整句照搬。":"No entire sentence was copied verbatim.","有一整句和卡片上的文字一模一样。":"An entire sentence matches the text on a card.","这一步要的是把两张卡接成一句":"The task is to connect two cards in a sentence","——接的过程里你得改动词形、加连接词、调语序，那才是真的在造关系。":", which may require changing verb forms, adding a connector, and adjusting the word order.","先只造最容易的一条：":"Start with one simple pair:","选错树种 → 熬不过天气":"unsuitable species → struggle in local weather","是因果吗？不是 —— 是「如果选错，就会熬不过」。想想哪一族。":". Consider whether you want to state a cause or emphasize a condition, and choose a marker that matches that claim.","第二条用让步：":"For a second sentence, use concession:","第三条用先后：":"For a third, use a prerequisite or sequence:","三条关系，三族标记，每一族都在说一件不同的事 —— 而这三族在中文里可以糊成一个「就」、一个「而且」、一个「才」。":"Three relationships and three marker families, each making a different kind of connection explicit.","英语逼你在动笔之前先想清楚：这到底是导致、是退让，还是只是先后。":"Before choosing a marker, decide whether you mean cause, concession, or sequence.","想清楚了再挂标记，那一刻你已经在用英语的方式组织想法了。":"Then the marker expresses a relationship you have deliberately chosen.","中文靠并置就能表达关系，英语必须把它说出来。":"Connections can sometimes remain implicit, but this exercise asks you to make them explicit in English.","说出来的代价是你得先想清楚它是哪一种":"To express a link, first decide what kind it is","—— 而这正是这一页的全部内容。":"—that is the purpose of this page.","前一件事导致后一件事":"One event brings about another","让一步再反驳":"Concede, then qualify","先把对方那条认下来，再把它翻过去":"Acknowledge a point, then introduce a counterpoint","行为背后是某人心里的一个判断":"An action is linked to someone's judgment","只是先后":"Sequence only","一件在另一件之前 —— 但不是它导致的":"One event precedes another without claiming that it causes it","两句就是并排":"No established connection","它们之间没有关系，硬加一个标记反而是错的":"No relationship is established here; adding a marker would mislead","不加标记":"No marker","连起来，说出来":"Connect and express","第 1 步 · 连两张卡，然后用英语把这条关系说出来":"Step 1 · Connect two cards and express the relationship in English","点两张卡连一条线，":"Click two cards to connect them,","再给这条线挑一个英语标记":"then choose an English marker for the link","—— 页面会把它拼成一句话。":". The page will combine them into a sentence.","有两张卡连不上":"One pair should remain unconnected","—— 它们之间根本没有关系。那一对你要按「这两张连不上」。":". Select “These cards do not connect” for that pair.","哪一族标记":"Choose the marker family","第 2 步 · 这条关系该用哪一族标记":"Step 2 · Which marker family fits this relationship?","五道题共用同一组五个选项。":"Five questions share the same five options.","其中两个是反过来的那一半":"Two options check the other side of the distinction","一个是「只是先后，不是因果」，另一个是「两句就是并排，不用标」。":": “sequence, not cause” and “no established relationship, no marker.”","换一段自己造":"Create with a new passage","第 3 步 · 换一段材料，自己造三条关系":"Step 3 · Create three relationships from a new passage","新的五张卡。":"Five new cards.","两头同时卡":"Check both directions","：该标不标不行；":": make needed connections explicit;","把本来没关系的两张硬连起来，更不行":"avoid inventing connections between unrelated claims","材料":"Material","造了 {0} / {1} 条{2}":"Created {0} / {1} relationships{2}","· 认出了连不上的那一对":"· Identified the unrelated pair","这两张之间是什么关系":"What connects these cards?","这两张连不上":"These cards do not connect","✗ 这两张之间没有可说的关系":"✗ No target relationship connects these cards","这一对不在今天要找的三条里面。换两张试试。":"This is not one of the three target pairs. Try two different cards.","现在挑一个词":"Now choose a word","这一族有 {2} 个，":"This family has {2} options.","它们意思相近但":"Their meanings are related, but their","分量和位置不一样":"emphasis and position differ","✗ 不是这一族":"✗ Not this family","拼出来了":"Sentence created","✗ 同一族，可这一个不合适":"✗ Right family, but this marker does not fit","再看一眼它在句子里该放哪儿、分量有多重。":"Check its position in the sentence and the strength of its claim.","对了，这两张连不上":"Correct—these cards do not connect","✗ 这两张连得上":"✗ These cards do connect","再想一想：前一张和后一张之间，是不是有一件事导致了另一件？":"Think again: does one statement describe a consequence of the other?","这一对确实连不上":"This pair does remain unconnected","但今天要认出的是":"But the target for this exercise is","另外一对":"a different pair","—— 那一对里的两张，看起来像有关系。":"whose claims may appear connected at first.","这两句":"The two statements","中文里你会怎么说这层关系：":"An explanation of the intended relationship:","英语里得这么说":"An English version","下一对":"Next pair","去第 3 步":"Go to step 3","第 {0} 对 / 共 {1} 对":"Pair {0} of {1}","对了":"Correct","✗ 再想一下":"✗ Think again","用上的标记族：{0}":"Marker families used: {0}","—— 你把它们塞进同一句还挂了标记。":"—you placed them in one sentence with a relationship marker.","中文可以并排一放就算说完，英语一挂标记就等于宣布了一条因果。":"A causal marker asserts a link; it is not merely a way of placing statements beside each other.","那两张本来没关系":"The unrelated pair","没有把本来没关系的两张硬连起来。":"You did not force the unrelated claims into a relationship.","新材料":"New material","碰到 {0} / 5 族":"Encountered {0} / 5 families","第 1 步造了":"Step 1: created","条关系{2}。":"relationships{2}.","，认出了连不上的那一对":", and identified the unrelated pair","第 2 步认出":"Step 2: identified","族{2}。":"families{2}.","，认错 {0} 次":", with {0} incorrect attempts","第 3 步写了":"Step 3: wrote","词。":"words.","还没开始。":"Not started yet.","点两张卡连一条线 ——":"Click two cards to connect them,","然后必须给它挑一个英语标记。":"then choose an English marker for the relationship.","三步都走完了":"All three steps complete","走完三步一共":"Across the three steps:","项":"items","没认出来":"Not identified","没做":"Not attempted","第 {0} 步 / 共 3 步":"Step {0} of 3","接着写":"Keep writing","提示":"Hint","{0} 词":"{0} words","建议至少 {0} 词":"Aim for at least {0} words","用上了":"Used","说了太多遍":"Repeated too often","✓ 完成":"✓ Complete","一个写法":"One possible version","完成":"Complete","说出这条关系-{0}.json":"say-the-relation-{0}.json","说出这条关系 · Say the Relation":"Say the Relation"};
  const normalize = text => String(text).replace(/\s+/g, ' ').trim();
  const escape = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const entries = Object.entries(dictionary).sort((a, b) => b[0].length - a[0].length);
  const patterns = entries.filter(([key]) => /\{\d+\}/.test(key)).map(([key, value]) => {
    const slots = [];
    const parts = key.split(/(\{\d+\})/g).map(part => {
      if (/^\{\d+\}$/.test(part)) { slots.push(part); return '(.*?)'; }
      return escape(part);
    });
    return { expression: new RegExp('^' + parts.join('') + '$'), value, slots };
  });
  const plain = entries.filter(([key]) => !/\{\d+\}/.test(key));
  function translate(value, depth = 0) {
    const text = normalize(value);
    if (!/[\u3400-\u9fff]/.test(text) || depth > 5) return String(value);
    if (dictionary[text] !== undefined) return dictionary[text];
    // Dynamic feedback sometimes concatenates complete sentences into one text node.
    const sentences = text.match(/[^。！？]+[。！？]|[^。！？]+$/g);
    if (sentences && sentences.length > 1) {
      const joined = sentences.map(sentence => translate(sentence, depth + 1)).join(' ');
      if (joined !== text && !/[\u3400-\u9fff]/.test(joined)) return joined;
    }
    for (const pattern of patterns) {
      const match = pattern.expression.exec(text);
      if (match) {
        const values = Object.fromEntries(pattern.slots.map((slot, index) => [slot, translate(match[index + 1], depth + 1)]));
        return pattern.value.replace(/\{\d+\}/g, slot => values[slot] ?? slot);
      }
    }
    let result = text;
    for (const [source, english] of plain) {
      if (result.includes(source)) result = result.split(source).join(' ' + english + ' ');
    }
    return result.replace(/\s+/g, ' ').trim();
  }
  window.eduToolTranslate = translate;
  // Canvas has no text nodes: translate authored labels at the drawing boundary.
  if (typeof CanvasRenderingContext2D !== 'undefined') {
    for (const method of ['fillText', 'strokeText']) {
      const original = CanvasRenderingContext2D.prototype[method];
      CanvasRenderingContext2D.prototype[method] = function (text, ...args) { return original.call(this, translate(text), ...args); };
    }
  }
  const excluded = 'script,style,textarea,input,[contenteditable="true"],[data-user-content]';
  function localizeText(node) {
    if (!node.parentElement || node.parentElement.closest(excluded)) return;
    const original = node.nodeValue;
    if (!/[\u3400-\u9fff]/.test(original || '')) return;
    const translated = translate(original);
    if (normalize(translated) !== normalize(original)) node.nodeValue = ' ' + translated + ' ';
  }
  function localizeElement(element) {
    if (element.matches('script,style,[data-user-content]')) return;
    for (const attr of ['aria-label', 'title', 'placeholder', 'alt', 'content']) {
      const source = element.getAttribute(attr);
      if (source && /[\u3400-\u9fff]/.test(source)) {
        const translated = translate(source);
        if (translated !== source) element.setAttribute(attr, translated);
      }
    }
  }
  function walk(root) {
    if (root.nodeType === 3) return localizeText(root);
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    if (root.nodeType === 1) localizeElement(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.nodeType === 3) localizeText(node); else localizeElement(node);
    }
  }
  function start() {
    walk(document);
    const observer = new MutationObserver(records => {
      for (const record of records) {
        if (record.type === 'characterData') localizeText(record.target);
        else if (record.type === 'attributes') localizeElement(record.target);
        else for (const node of record.addedNodes) walk(node);
      }
    });
    observer.observe(document.documentElement, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:['aria-label','title','placeholder','alt','content']});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
})();

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fz);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:99;background:#fff;padding:10px;border:2px solid var(--acc);border-radius:8px}
:focus-visible{outline:3px solid rgba(0,0,0,.28);outline-offset:2px}
.hide{display:none!important}
.topbar{display:flex;align-items:center;gap:14px;padding:0 clamp(14px,3vw,30px);height:58px;flex-wrap:wrap;

<script>
/* ══════════════════════════════════════════════════════════════════
   C59 说出这条关系 —— 自包含运行时
   数据注入点：见下方 D。格式见 example-data.js。
   ⚠ 这是学生页面。不写理论名词、文献、认知过程学名。
   ⚠ 这一个是轨道 B 的升级：C07 / C08 / C09 / C10 / C11 五个旧模板
     共用同一段 relationBuilder，是一个东西的五张皮，而且【连完线就结束】——
     全程可以用中文思考。这一版把那一步补上了：
     【每建立一条关系，必须用英语把这条关系说出来，并且在近义标记里选对那一个。】
   ⚠ 主交互是【连边 + 给边挂一个英语标记 + 页面把它拼成一句话】。
     先选族，再选词 —— 两步分开，因为「知道是因果」和「知道该用哪个因果词」是两件事。
   ⚠ 反向那一半在这一页是两个，对应学生的两种毛病：
     time —— 该标先后的地方标成了因果（中文里「然后」和「所以」界限本来就糊）；
     none —— 两句就是并排，硬加一个 therefore 反而是错的（矫枉过正）。
     第 1 步有一对卡【连不上】，学生要自己按下「这两张连不上」。
   ⚠ 第 3 步两头同时卡：variety（三条关系要用三族不同的标记）
     + no_overlink（本来没关系的两张，不能塞进同一句还挂上标记）。
   ⚠ 这不是考试题型。不提任何考试名称、不评分、不教答题套路。
   ══════════════════════════════════════════════════════════════════ */
const D = {
  "id": "say-the-relation-city-trees",
  "title": "连两张卡，然后用英语把这条关系说出来",
  "level": "B1–B2",
  "needEdges": 3,
  "material": "这几张卡来自 <b>Why Cities Are Planting More Trees</b>（仓库自带的那篇阅读）。它们都是原文里的短句，<b>顺序打乱了</b>。",
  "rule": "<b>中文可以把两句话并排一放，关系自己就出来了。英语不行。</b>「树遮阴，蓄的热就少」—— 中文里那个「就」几乎不占分量；英语必须摆出一个 <em>so</em>，而且摆出来之后，这条因果就<b>被你宣布了</b>，收不回去。<br>所以英语里造一条关系有两个动作：<b>选对是哪一族，再选对是哪一个词。</b>",
  "closingNote": "三条关系，三个标记，全都是<b>你自己摆上去的</b>。<br>注意最后那一对：它们各自都成立，可你不能把它们连起来 —— <b>中文里两句一并排就算说完了，英语里一挂标记就等于宣布了一条因果。</b>这就是「意合」和「形合」的差别落在手上的样子。",
  "frags": [
    {
      "id": "f1",
      "en": "their branches shade hard surfaces",
      "zh": "树枝给硬地面遮阴"
    },
    {
      "id": "f2",
      "en": "less heat is stored",

    },
    {
      "id": "f3",
      "en": "the route with mature trees had 18% more pedestrians",
      "zh": "有成年树的那条路，行人多了 18%"
    },
    {
      "id": "f4",
      "en": "the comparison does not prove that trees caused every difference",
      "zh": "这个对比并不能证明差别全是树造成的"
    },
    {
      "id": "f5",
      "en": "young trees need regular watering and pruning",
      "zh": "小树需要定期浇水和修剪"
    },
    {
      "id": "f6",
      "en": "they can provide wide shade",
      "zh": "它们才遮得出大片阴凉"
    }
  ],
  "links": [
    {
      "id": "e1",
      "from": "f1",
      "to": "f2",
      "kind": "cause",
      "marker": "so",
      "sentence": "Their branches shade hard surfaces, so less heat is stored.",
      "why": "遮阴<b>导致</b>蓄热变少 —— 前一件事是后一件事的原因，而且中间没有任何时间差或者条件。<br>中文说「树枝遮阴，蓄的热就少了」，那个「就」轻得几乎不算一个词；<b>英语必须摆出一个 so，摆出来这条因果才成立。</b>",
      "wordWhy": {
        "therefore": "<em>therefore</em> 太正式，而且它通常带一点「推论」的味道 —— 适合从证据推出结论，不适合描述一个物理过程。<b>物理上的直接因果用 so 就够，用 therefore 反而像在做论证。</b>",
        "as a result": "<em>as a result</em> 强调「这是那件事造成的后果」，分量比 so 重，而且它常常另起一句。这一句两半贴得很紧，用它会把句子撑开。",
        "which is why": "<em>which is why</em> 是回头解释 —— 「这就是为什么…」，它要求后半是一个<b>已经被提到过</b>的事实。这里蓄热少是第一次出现。"
      },

        "fail": "你把<b>选错树种熬不过天气</b>和<b>学校附近受益的人多</b>塞进了同一句，还挂上了一个标记。<br>这两件事之间没有任何关系：选错树不会让学校变热，学校热也不会让树选错。<b>中文里并排一放还挺自然，英语里一挂标记就等于宣布了一条因果，而且收不回去。</b>把它们拆成两句，中间什么都不加。"
      },
      {
        "kind": "min_words",

        "pass": "够长，三条关系都说清楚了。",
        "fail": "太短了 —— 三十五个词以下装不下三条完整的关系。每一条都要是一句能读的英语：两端各是什么、中间那个标记摆在哪儿。"

      }
    ],
    "hints": [
      "先只造最容易的一条：<b>选错树种 → 熬不过天气</b> 是因果吗？不是 —— 是「如果选错，就会熬不过」。想想哪一族。",
      "第二条用让步：<em>The city places suitable trees where shade matters most. That said, poorly chosen species struggle in local weather.</em>",

  },
  "closing": "中文靠并置就能表达关系，英语必须把它说出来。<b>说出来的代价是你得先想清楚它是哪一种</b> —— 而这正是这一页的全部内容。"
};

/* 锁定 5 族关系标记。
   time 和 none 是【两个反向】，对应学生的两种毛病：
     time —— 该标先后的地方标成了因果（中文里「然后」和「所以」界限本来就糊）
     none —— 两句就是并排，硬加一个 therefore 反而是错的（矫枉过正） */
const KD = {
  cause:  {zh:'因果',        q:'前一件事导致后一件事',
           words:['so','therefore','as a result','which is why'],
           ex:'so / as a result'},
  concede:{zh:'让一步再反驳', q:'先把对方那条认下来，再把它翻过去',
           words:['admittedly','that said','even so','granted'],
           ex:'that said / even so'},
  mind:   {zh:'谁以为什么',   q:'行为背后是某人心里的一个判断',
           words:['assume','take it that','be under the impression that','realise'],
           ex:'assume / take it that'},
  time:   {zh:'只是先后',     q:'一件在另一件之前 —— 但不是它导致的',
           words:['only after','by the time','before','once'],
           ex:'only after / before'},
  none:   {zh:'两句就是并排', q:'它们之间没有关系，硬加一个标记反而是错的',
           words:[], ex:'不加标记'}
};
const KORDER=['cause','concede','mind','time','none'];

const STEPS=[
  {n:1,zh:'连起来，说出来',t:'第 1 步 · 连两张卡，然后用英语把这条关系说出来',
   d:'点两张卡连一条线，<b>再给这条线挑一个英语标记</b> —— 页面会把它拼成一句话。<br>'
    +'<b>有两张卡连不上</b> —— 它们之间根本没有关系。那一对你要按「这两张连不上」。'},
  {n:2,zh:'哪一族标记',t:'第 2 步 · 这条关系该用哪一族标记',
   d:'五道题共用同一组五个选项。<b>其中两个是反过来的那一半</b>：<br>'
    +'一个是「只是先后，不是因果」，另一个是「两句就是并排，不用标」。'},
  {n:3,zh:'换一段自己造',t:'第 3 步 · 换一段材料，自己造三条关系',
   d:'新的五张卡。<b>造三条关系，每条用一族不同的标记，写成英语。</b><br>'
    +'<b>两头同时卡</b>：该标不标不行；<b>把本来没关系的两张硬连起来，更不行</b>。'}
];

const FR=D.frags||[], LK=D.links||[], QS=D.families||[];
const byF=id=>FR.find(f=>f.id===id)||{};
const SRC=()=>FR.map(f=>f.en).concat(LK.map(l=>l.sentence||'')).join(' ');

const KEY='ll_c59_'+(D.id||'default');
let S=Object.assign({step:1,written:'',hintI:0},{sel:[],got:{},nolink:0,tryFam:{},tryWd:{},qi:0,qans:{},qwrong:{}});
let EV=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(m){$('live').textContent='';requestAnimationFrame(()=>$('live').textContent=m)}
function ev(t,p){EV.push({asset:'c59-say-the-relation',set:D.id,type:t,at:Date.now(),...p});save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,EV}))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S=Object.assign(S,d.S);EV=d.EV||[]}}catch(e){}}


const NEED=D.needEdges||3;
const pairKey=(a,b)=>[a,b].sort().join('~');
const NOKEY=D.noPair?pairKey(D.noPair.from,D.noPair.to):'';
const linkOf=(a,b)=>LK.find(l=>pairKey(l.from,l.to)===pairKey(a,b));
const doneEdges=()=>Object.keys(S.got).length;
const usedFrag=id=>Object.keys(S.got).some(k=>k.split('~').includes(id))
  ||(S.nolink&&NOKEY.split('~').includes(id));

/* ══ 1 连边 + 挂标记 ══ */
const done1=()=>doneEdges()>=NEED&&!!S.nolink;
function draw1(){
  $('s1body').innerHTML=`<div class="ctx"><b class="lbl">材料</b>${D.material||''}</div>
    <div class="board" id="board"></div><div id="picker"></div>
    <div class="done-edges" id="madeEdges"></div>`;
  paintBoard(); paintPicker(); paintMade(); drawDQ();
}
function drawDQ(){
  const n=doneEdges();
  $('dq').innerHTML=Array.from({length:NEED},(_,i)=>`<i class="${i<n?'done':''}"></i>`).join('')
    +`<i class="${S.nolink?'done':''}"></i>`;
  $('s1Meta').textContent=`造了 ${n} / ${NEED} 条${S.nolink?' · 认出了连不上的那一对':''}`;
}
function paintBoard(){
  $('board').innerHTML=FR.map(f=>{
    const on=S.sel.includes(f.id), used=usedFrag(f.id);
    return `<button class="frag${on?' on':''}${used?' used':''}" data-f="${f.id}">
      <span class="tag">${esc(f.id.toUpperCase())}</span>
      <span class="en">${esc(f.en)}</span><span class="zh">${esc(f.zh)}</span></button>`}).join('');
  $('board').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.f;
    S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id].slice(-2);
    save();paintBoard();paintPicker();
  });
}
function paintPicker(){
  const box=$('picker');
  if(S.sel.length!==2){box.innerHTML='';return}
  const [a,b]=S.sel, key=pairKey(a,b), lk=linkOf(a,b);
  if(S.got[key]){box.innerHTML='';return}
  const fam=S.tryFam[key]||'';
  const wrongF=(S.tryWd[key+'|f']||[]), wrongW=(S.tryWd[key+'|w']||[]);
  const fams=KORDER.filter(k=>k!=='none').map(k=>{
    const bad=wrongF.includes(k), ok=fam===k;
    return `<button class="fam${ok?' right':''}${k==='time'?' timek':''}" data-fam="${k}"
      style="border-color:${ok?'':'var(--'+k+')'}" ${bad||fam?'disabled':''}>
      <span style="color:var(--${k})">${KD[k].zh}</span><span class="ex">${esc(KD[k].ex)}</span></button>`}).join('');
  const words=fam?`<div class="words">${KD[fam].words.map(w=>{
    const bad=wrongW.includes(w), ok=lk&&lk.marker===w;
    return `<button class="wd${(bad?'':'')}" data-wd="${esc(w)}" ${bad?'disabled':''}>${esc(w)}</button>`}).join('')}</div>`:'';
  box.innerHTML=`<div class="picker">
      <div class="ph">这两张之间是什么关系</div>
      <div class="pair"><span class="p1">${esc(byF(a).en)}</span><span class="arr">—</span>
        <span class="p2">${esc(byF(b).en)}</span></div>
      <div class="fams">${fams}</div>${words}
      <button class="nolinkbtn" data-nolink="1">这两张连不上</button>
      <div id="fbp"></div></div>`;
  box.querySelectorAll('[data-fam]').forEach(x=>x.onclick=()=>pickFam(key,lk,x.dataset.fam));
  box.querySelectorAll('[data-wd]').forEach(x=>x.onclick=()=>pickWd(key,lk,x.dataset.wd));
  box.querySelector('[data-nolink]').onclick=()=>pickNo(key);
}
function pickFam(key,lk,k){
  if(!lk){
    $('fbp').innerHTML=`<div class="fb no" style="margin-top:13px"><div class="fb-h">✗ 这两张之间没有可说的关系</div>
      ${key===NOKEY?(D.noPair.hint||''):'这一对不在今天要找的三条里面。换两张试试。'}</div>`;
    return;
  }
  if(k===lk.kind){S.tryFam[key]=k;save();paintPicker();
    $('fbp').innerHTML=`<div class="fb ok" style="margin-top:13px"><div class="fb-h">✓ ${KD[k].zh}</div>
      ${lk.why}<div class="fb-x"><b class="lbl">现在挑一个词</b>这一族有 ${KD[k].words.length} 个，
      它们意思相近但<b>分量和位置不一样</b>。</div></div>`;
    return}
  S.tryWd[key+'|f']=[...new Set([...(S.tryWd[key+'|f']||[]),k])];save();paintPicker();
  $('fbp').innerHTML=`<div class="fb no" style="margin-top:13px"><div class="fb-h">✗ 不是这一族</div>
    ${(lk.confusions||{})[k]||''}</div>`;
}
function pickWd(key,lk,w){
  if(!lk)return;
  if(w===lk.marker){
    S.got[key]={kind:lk.kind,marker:w,sentence:lk.sentence,id:lk.id};S.sel=[];save();
    ev('edge',{e:lk.id,kind:lk.kind});
    paintBoard();paintPicker();paintMade();drawDQ();drawSteps();drawLog();drawSide();say('拼出来了');
    return}
  S.tryWd[key+'|w']=[...new Set([...(S.tryWd[key+'|w']||[]),w])];save();paintPicker();
  $('fbp').innerHTML=`<div class="fb no" style="margin-top:13px"><div class="fb-h">✗ 同一族，可这一个不合适</div>
    ${(lk.wordWhy||{})[w]||'再看一眼它在句子里该放哪儿、分量有多重。'}</div>`;
}
function pickNo(key){
  if(key===NOKEY){
    S.nolink=1;S.sel=[];save();ev('nolink',{ok:1});
    paintBoard();paintPicker();paintMade();drawDQ();drawSteps();drawLog();drawSide();say('对了，这两张连不上');
    return}
  const lk=LK.find(l=>pairKey(l.from,l.to)===key);
  $('fbp').innerHTML=lk
    ? `<div class="fb no" style="margin-top:13px"><div class="fb-h">✗ 这两张连得上</div>
       ${lk.nolinkMiss||'再想一想：前一张和后一张之间，是不是有一件事导致了另一件？'}</div>`
    : `<div class="fb" style="margin-top:13px"><div class="fb-h">这一对确实连不上</div>
       但今天要认出的是<b>另外一对</b> —— 那一对里的两张，看起来像有关系。</div>`;
}
function paintMade(){
  const rows=Object.entries(S.got).map(([k,v])=>
    `<div class="de"><span class="k" style="background:var(--${v.kind})">${KD[v.kind].zh}</span>
      <span class="s">${String(v.sentence).replace(new RegExp('\\b'+v.marker.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),
        m=>`<mark>${m}</mark>`)}</span></div>`).join('');
  const no=S.nolink?`<div class="de nolink"><span class="k" style="background:var(--none)">${KD.none.zh}</span>
      <span>${D.noPair.why||''}</span></div>`:'';
  $('madeEdges').innerHTML=rows+no
    +(done1()?`<div class="zhline">${D.closingNote||''}</div>`:'');
}

/* ══ 2 哪一族标记 ══ */
const done2=()=>QS.every(q=>S.qans[q.id]);
function draw2(){
  const q=QS[Math.min(S.qi||0,QS.length-1)], locked=!!S.qans[q.id], wrong=S.qwrong[q.id]||[];
  const btns=KORDER.map(k=>{
    const bad=wrong.includes(k), right=locked&&q.kind===k;
    return `<button class="fam${right?' right':''}${k==='none'?' nonek':''}${k==='time'?' timek':''}"
      data-k="${k}" style="border-color:${right?'':'var(--'+k+')'}" ${bad||locked?'disabled':''}>
      <span style="color:var(--${k})">${KD[k].zh}</span><span class="ex">${esc(KD[k].q)}</span></button>`}).join('');
  $('s2body').innerHTML=`<div class="q2pair"><span class="l">这两句</span>
      <div class="fr">${esc(q.a)}</div><div class="fr">${esc(q.b)}</div>
      <div class="rel">中文里你会怎么说这层关系：<b>${esc(q.zh)}</b></div></div>
    <div class="fams" style="margin-top:15px">${btns}</div><div id="fb2"></div>
    ${locked&&q.english?`<div class="built2"><span class="l">英语里得这么说</span>${
      String(q.english).replace(/\{(.+?)\}/g,(m,w)=>`<mark>${esc(w)}</mark>`)}</div>`:''}
    <div class="go">${locked?`<button class="btn pri" id="btnNextQ">${
      (S.qi||0)<QS.length-1?'下一对':'去第 3 步'}</button>`:''}</div>`;
  $('dq2').innerHTML=QS.map(x=>{
    if(!S.qans[x.id])return x.id===q.id?'<i class="now"></i>':'<i></i>';
    return `<i class="${(S.qwrong[x.id]||[]).length?'miss':'done'}"></i>`}).join('');
  $('s2Meta').textContent=`第 ${(S.qi||0)+1} 对 / 共 ${QS.length} 对`;
  $('s2body').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k===q.kind){S.qans[q.id]=k;save();ev('fam',{q:q.id,ok:1});
      draw2();drawSteps();drawLog();drawSide();say('对了');return}
    S.qwrong[q.id]=[...new Set([...wrong,k])];save();ev('fam',{q:q.id,ok:0,chose:k});
    draw2();drawLog();
    $('fb2').innerHTML=`<div class="fb no"><div class="fb-h">✗ 再想一下</div>${(q.confusions||{})[k]||''}</div>`;
  });
  if(locked)$('fb2').innerHTML=`<div class="fb ok"><div class="fb-h">✓ ${KD[q.kind].zh}</div>${q.why}</div>`;
  if($('btnNextQ'))$('btnNextQ').onclick=()=>{
    if((S.qi||0)<QS.length-1){S.qi=(S.qi||0)+1;save();draw2()}else go(3)};
}

/* ══ 3 自己造三条 ══ */
const BIGW=/[a-z']{4,}/gi;
function keyHit(t,words){const s=String(t||'').toLowerCase();return (words||[]).some(w=>s.includes(String(w).toLowerCase()))}
function extraCheck(k,text){
  const w=D.write||{};
  if(k.kind==='no_overlink'){
    paintLink(text);
    const np=w.noPair||{}; const marks=(w.checks||[]).find(c=>c.kind==='variety');
    const sents=String(text||'').split(/(?<=[.!?])\s+/);
    /* 那两张【本来没关系】的卡，不能被塞进同一句、还挂上一个关系标记 */
    return !sents.some(s=>keyHit(s,np.aWords)&&keyHit(s,np.bWords)
      &&(marks&&(marks.forms||[]).some(f=>{try{return new RegExp(f.re,'i').test(s)}catch(e){return false}})));
  }
  paintLink(text); return true;
}
function paintLink(t){
  const el=$('linkMeter'); if(!el)return;
  const w=D.write||{}, vf=((w.checks||[]).find(c=>c.kind==='variety')||{}).forms||[];
  const got=vf.filter(f=>{try{return new RegExp(f.re,'i').test(String(t||''))}catch(e){return false}});
  const np=w.noPair||{};
  const sents=String(t||'').split(/(?<=[.!?])\s+/);
  const over=sents.some(s=>keyHit(s,np.aWords)&&keyHit(s,np.bWords)
    &&vf.some(f=>{try{return new RegExp(f.re,'i').test(s)}catch(e){return false}}));
  el.innerHTML=`用上的标记族：${vf.map(f=>
      `<span class="${got.some(g=>g.zh===f.zh)?'got':'none2'}">${esc(f.zh)}</span>`).join(' ')}`
    +(over?`<br><span class="warn2">${esc(np.label||'那两张本来没关系')}</span> —— 你把它们塞进同一句还挂了标记。
       <b>中文可以并排一放就算说完，英语一挂标记就等于宣布了一条因果。</b>`
      :'<br>没有把本来没关系的两张硬连起来。');
}
function extra3(){
  const w=D.write||{};
  $('x3').innerHTML=`<div class="ctx"><b class="lbl">新材料</b>${w.material||''}</div>
    <div class="board">${(w.frags||[]).map(f=>
      `<div class="frag" style="cursor:default"><span class="tag">${esc(f.id.toUpperCase())}</span>
       <span class="en">${esc(f.en)}</span><span class="zh">${esc(f.zh)}</span></div>`).join('')}</div>
    <div class="linkmeter" id="linkMeter"></div>`;
  paintLink(S.written||'');
}

/* ══ 右栏 ══ */
function drawSide(){
  $('lg').innerHTML=KORDER.map(k=>{
    const n=Object.values(S.got).some(v=>v.kind===k)||QS.some(q=>S.qans[q.id]===k)
      ||(k==='none'&&S.nolink);
    return `<div class="lgi${n?'':' zero'}">
      <span class="d" style="background:var(--${k})"></span>
      <span class="t"><span class="n" style="color:var(--${k})">${KD[k].zh}</span>
      <span class="q">${KD[k].q}${KD[k].words.length?`<br><i>${KD[k].words.join(' · ')}</i>`:''}</span></span>
      <span class="k">${n?'✓':'—'}</span></div>`}).join('');
  const m=KORDER.filter(k=>Object.values(S.got).some(v=>v.kind===k)||QS.some(q=>S.qans[q.id]===k)
    ||(k==='none'&&S.nolink)).length;
  $('lgN').textContent=m?`碰到 ${m} / 5 族`:'';
  $('rule').innerHTML=D.rule||'';
}
function drawLog(){
  const n1=doneEdges(), n2=Object.keys(S.qans).length, m2=Object.values(S.qwrong).flat().length;
  $('log').innerHTML=(n1||n2||S.nolink)
    ? `第 1 步造了 <b>${n1} / ${NEED}</b> 条关系${S.nolink?'，认出了连不上的那一对':''}。`
      +(n2?`<br>第 2 步认出 <b>${n2} / ${QS.length}</b> 族${m2?`，认错 ${m2} 次`:''}。`:'')
      +(S.written?`<br>第 3 步写了 <b>${S.written.trim().split(/\s+/).length}</b> 词。`:'')
    : '还没开始。<br>点两张卡连一条线 —— <b>然后必须给它挑一个英语标记。</b>';
  const tot=NEED+1+QS.length+1, dn=n1+(S.nolink?1:0)+n2+(S.written?1:0);
  $('barF').style.width=(dn/tot*100)+'%';
  $('barL').textContent=dn>=tot?'三步都走完了':'走完三步一共 '+tot+' 项';
  $('barR').textContent=`${dn}/${tot}`;
}
function exportData(){return {
  五族关系标记:KORDER.map(k=>`${KD[k].zh} —— ${KD[k].q}${KD[k].words.length?'：'+KD[k].words.join(' / '):''}`),
  第1步我造的:Object.values(S.got).map(v=>({族:KD[v.kind].zh,标记:v.marker,拼出来的句子:v.sentence})),
  连不上的那一对:S.nolink?String(D.noPair.why||'').replace(/<[^>]+>/g,''):'没认出来',
  第2步:QS.map(q=>({两句:[q.a,q.b],答案:S.qans[q.id]?KD[S.qans[q.id]].zh:'没做',
    走过的弯路:(S.qwrong[q.id]||[]).map(k=>KD[k].zh)})),
  第3步我写的:S.written
}}

const can=n=>n===1||(n===2&&done1())||(n===3&&done1()&&done2());
function drawSteps(){
  $('steps').innerHTML=STEPS.map(s=>{
    const d=(s.n===1&&done1())||(s.n===2&&done2())||(s.n===3&&S.written);
    return `<button class="stp${S.step===s.n?' on':''}" data-n="${s.n}" ${can(s.n)?'':'disabled'}>
      <span class="k">${s.n}${d?'✓':''}</span>${s.zh}</button>`;
  }).join('');
  $('steps').querySelectorAll('.stp').forEach(b=>b.onclick=()=>go(+b.dataset.n));
}
function drawBan(){const s=STEPS[S.step-1];$('banN').textContent=`第 ${s.n} 步 / 共 3 步`;$('banT').textContent=s.t;$('banD').innerHTML=s.d}
function go(n){
  if(!can(n))return;
  S.step=n;save();
  ['s1','s2','s3'].forEach((id,i)=>$(id).classList.toggle('hide',i+1!==n));
  drawSteps();drawBan();drawSide();drawLog();
  if(n===1)draw1();if(n===2)draw2();if(n===3)draw3();
  ev('step',{step:n});
}

/* ══ 第 3 步的通用检查引擎（各模板在 data 里声明 checks） ══ */
function hits(k,t){return (k.forms||[]).filter(f=>{try{return new RegExp(f.re,'i').test(t)}catch(e){return false}})}
function firstAt(forms,t){
  let best=-1;(forms||[]).forEach(f=>{try{const m=t.match(new RegExp(f.re,'i'));
    if(m&&(best<0||m.index<best))best=m.index}catch(e){}});return best;
}
function reps(k,t){
  const c={};(String(t).toLowerCase().match(/[a-z']+/g)||[]).forEach(x=>{
    if(x.length>=(k.minLen||5))c[x]=(c[x]||0)+1});
  return Object.entries(c).filter(([,n])=>n>=(k.n||3)).map(([x])=>x);
}
function runCheck(k,text){
  const w=D.write||{},tl=text.toLowerCase();
  switch(k.kind){
    case 'has_any':   return hits(k,text).length>0;
    case 'variety':   return hits(k,text).length>=(k.n||2);
    case 'no_repeat': return reps(k,text).length===0;
    case 'min_words': return text.split(/\s+/).filter(Boolean).length>=(k.n||25);
    case 'max_words': return text.split(/\s+/).filter(Boolean).length<=(k.n||60);
    case 'order':{
      const cs=w.checks||[];
      const a=firstAt((cs.find(c=>c.kind===k.first)||{}).forms,text);
      const b=firstAt((cs.find(c=>c.kind===k.then)||{}).forms,text);
      return a>=0&&b>=0&&a<b;
    }
    case 'not_copied':{
      const parts=String(SRC()).toLowerCase().split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.length>=20);
      return parts.filter(x=>tl.includes(x)).length===0;
    }
    case 'regex':     try{return new RegExp(k.pattern,k.flags||'i').test(text)}catch(e){return true}
    case 'not_regex': try{return !new RegExp(k.pattern,k.flags||'i').test(text)}catch(e){return true}
  }
  /* 模板自己可以再加检查种类：在下面定义 function extraCheck(k,text) 就行 */
  if(typeof extraCheck==='function')return extraCheck(k,text);
  return true;
}
function draw3(){
  const w=D.write||{};
  if($('wScene'))$('wScene').innerHTML=`<div class="ctx"><b class="lbl">${w.label||'接着写'}</b>${w.scenario||''}</div>`;
  if($('wants'))$('wants').innerHTML=(w.wants||[]).map((t,i)=>
    `<div class="want"><span class="n">${i+1}</span><span>${t}</span></div>`).join('');
  extra3();
  const ta=$('ta'); if(!ta)return;
  ta.placeholder=w.placeholder||'';
  ta.value=S.written||'';
  ta.oninput=()=>{S.written=ta.value;save();countW()};
  countW();
  $('btnCheck').onclick=()=>check();
  $('btnHint').onclick=()=>{
    const hs=w.hints||[];if(!hs.length)return;
    const h=hs[Math.min(S.hintI,hs.length-1)];S.hintI++;save();
    $('hintBox').innerHTML=`<div class="fb" style="border-left:4px solid var(--warn)"><div class="fb-h" style="color:var(--warn)">提示</div>${h}</div>`;
    ev('hint',{i:S.hintI});
  };
  if(S.written)check(true);
}
function countW(){
  const w=D.write||{},v=($('ta').value||'').trim();
  const n=v?v.split(/\s+/).length:0;
  const min=((w.checks||[]).find(c=>c.kind==='min_words')||{}).n||0;
  $('wcL').textContent=`${n} 词`;
  $('wcR').textContent=n<min?`建议至少 ${min} 词`:'';
}
function check(silent){
  const w=D.write||{},text=($('ta').value||'').trim();
  if(!text){$('chk').classList.add('hide');return}
  const res=(w.checks||[]).map(k=>({k,p:runCheck(k,text)}));
  $('chk').classList.remove('hide');
  $('chk').innerHTML=res.map(r=>{
    let d=r.p?(r.k.pass||''):(r.k.fail||'');
    if(r.k.kind==='has_any'||r.k.kind==='variety'){
      const h=hits(r.k,text);
      if(h.length)d+=`<br><b style="display:inline;color:var(--ok)">用上了</b> ${h.map(f=>esc(f.zh)).join('、')}`;
    }
    if(r.k.kind==='no_repeat'){
      const b=reps(r.k,text);
      if(b.length)d+=`<br><b style="display:inline;color:var(--no)">说了太多遍</b> ${b.join('、')}`;
    }
    return `<li class="${r.p?'p':'f'}"><span class="m">${r.p?'✓':'✗'}</span>
      <span><b>${esc(r.k.label)}</b><span class="d">${d}</span></span></li>`;
  }).join('');
  if(silent===true)return;
  if(res.every(r=>r.p)){
    $('hintBox').innerHTML=`<div class="fb ok" style="margin-top:15px"><div class="fb-h">✓ 完成</div>${w.done||''}
      ${w.sample?`<div class="fb-x"><b class="lbl">一个写法</b><em>${esc(w.sample)}</em></div>`:''}</div>`;
    ev('done',{words:text.split(/\s+/).length});say('完成');
  }else{$('hintBox').innerHTML='';ev('retry',{})}
  save();drawLog();
}
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(Object.assign({
    这一份:D.title,导出时间:new Date().toLocaleString('zh-CN')},exportData()),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`说出这条关系-${D.id||'set'}.json`;a.click();URL.revokeObjectURL(a.href);
};
$('btnReset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
load();drawSteps();drawBan();drawSide();drawLog();
go(can(S.step)?S.step:1);
</script>
